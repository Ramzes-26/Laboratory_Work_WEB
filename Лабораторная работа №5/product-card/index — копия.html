<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport-Pit от Ramzesio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Каталог товаров</h1>

        <!-- Область для объявлений скринридерам -->
        <div
            aria-live="polite"
            aria-atomic="true"
            class="visually-hidden"
            id="live-region">
        </div>

        <!-- Карточка товара -->
        <article
            class="card"
            aria-labelledby="product-title"
            aria-describedby="product-desc">

            <!-- Изображение товара и бейджи -->
            <div class="card__image-wrapper">
                <img
                    src="images/product.jpg"
                    alt="Сывороточный протеин Ramzes WHEY, шоколад"
                    class="card__image">

                <span class="card__badge">
                    Хит продаж
                </span>

                <span class="card__category">
                    Протеин
                </span>
            </div>

            <!-- Контентная часть -->
            <div class="card__content">
                <h2 class="card__title" id="product-title">
                    Спортивный Sport-Pit
                </h2>

                <p class="card__description" id="product-desc">
                    Сывороточный протеин Ramzes WHEY 900 гр. Шоколад
                </p>

                <!-- Цена -->
                <p class="card__price">
                    <span class="card__price-value" aria-label="4990 рублей">
                        4 990 ₽
                    </span>
                </p>

                <!-- Кнопка добавления в корзину -->
<button
    class="card__button button button--primary"
    type="button"
    aria-label="Добавить протеин в корзину"
    onclick="addToCart()">
    <svg class="button__icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span class="button__text">В корзину</span>
</button>

                <!-- Ссылка Подробнее -->
                <a
                    href="#"
                    class="card__link link"
                    aria-label="Подробнее о протеине">
                    Подробнее
                </a>
            </div>
        </article>
    </main>

    <!-- JavaScript -->
    <script>
        function addToCart() {
            const liveRegion = document.getElementById('live-region');
            liveRegion.textContent = 'Товар добавлен в корзину';

            setTimeout(() => {
                liveRegion.textContent = '';
            }, 300
